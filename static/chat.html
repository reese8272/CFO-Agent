<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal CFO — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #E4EDE6; --surface: #252B28; --surface-text: #C8D8CC;
      --surface-muted: #7A9A87; --surface-border: #363F3B;
      --sage-xs: #EEF3EF; --sage-light: #B8CCBB; --sage: #7A9B83; --sage-dark: #4D5E58;
      --text: #2E3D36; --text-muted: #7A9585; --text-dim: #A8BDB2;
      --user-bubble: #2E3D36; --user-text: #E4EDE6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); font-size: 14px; display: flex; }

    /* Sidebar */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--surface-border);
      display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
    }
    .sidebar-top { padding: 1.25rem 1rem 1rem; border-bottom: 1px solid var(--surface-border); }
    .logo { font-size: 0.875rem; font-weight: 600; color: var(--sage-light); letter-spacing: -0.02em; display: block; margin-bottom: 0.75rem; }
    .btn-new {
      width: 100%; font-family: 'Inter', sans-serif; font-size: 0.775rem; font-weight: 500;
      color: var(--surface-text); background: rgba(255,255,255,0.07);
      border: 1px solid var(--surface-border); border-radius: 8px;
      padding: 0.45rem 0.75rem; cursor: pointer; transition: background 0.15s; text-align: left;
    }
    .btn-new:hover { background: rgba(255,255,255,0.11); }
    .nav-links { padding: 1rem 0; flex: 1; }
    .nav-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--surface-muted); padding: 0 1rem; margin: 0.75rem 0 0.3rem; opacity: 0.6; }
    .nav-link {
      display: block; padding: 0.38rem 1rem 0.38rem 1.25rem;
      font-size: 0.8rem; color: var(--surface-muted); text-decoration: none;
      border-left: 2px solid transparent; transition: color 0.1s, background 0.1s;
    }
    .nav-link:hover { color: var(--surface-text); background: rgba(255,255,255,0.05); }
    .nav-link.active { color: var(--surface-text); font-weight: 500; border-left-color: var(--sage); background: rgba(255,255,255,0.06); }
    .sidebar-bottom { padding: 1rem; border-top: 1px solid var(--surface-border); }
    .btn-signout { font-family: 'Inter', sans-serif; font-size: 0.75rem; color: var(--surface-muted); background: none; border: none; cursor: pointer; padding: 0; transition: color 0.12s; }
    .btn-signout:hover { color: var(--surface-text); }

    /* Chat area */
    .chat-area { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .messages { flex: 1; overflow-y: auto; padding: 2rem 2.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

    /* Empty state */
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .empty-title { font-size: 1.1rem; font-weight: 500; color: var(--text); letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    .empty-sub { font-size: 0.825rem; color: var(--text-muted); margin-bottom: 2rem; line-height: 1.6; }
    .starters { display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-width: 480px; }
    .starter {
      background: var(--surface); border: 1px solid var(--surface-border); border-radius: 10px;
      padding: 0.75rem 1rem; text-align: left; cursor: pointer; font-family: 'Inter', sans-serif;
      font-size: 0.825rem; color: var(--surface-text); transition: background 0.12s;
    }
    .starter:hover { background: rgba(37,43,40,0.85); }
    .starter-label { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--surface-muted); margin-bottom: 0.2rem; }

    /* User message */
    .msg-row { display: flex; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.agent { justify-content: flex-start; }
    .bubble-user {
      background: var(--user-bubble); color: var(--user-text);
      border-radius: 14px 14px 4px 14px; padding: 0.75rem 1rem;
      max-width: 65%; font-size: 0.875rem; line-height: 1.6;
    }

    /* Agent message card */
    .agent-card {
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 4px 14px 14px 14px; padding: 1.1rem 1.25rem;
      max-width: 75%;
    }
    .agent-recommendation { font-size: 0.9rem; color: var(--surface-text); line-height: 1.7; margin-bottom: 0.75rem; }
    .agent-recommendation strong { color: var(--sage-light); font-weight: 500; }
    .agent-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .tag-principle {
      font-size: 0.67rem; font-weight: 500; letter-spacing: 0.03em;
      color: var(--sage); background: rgba(122,155,131,0.12);
      border: 1px solid rgba(122,155,131,0.25); border-radius: 20px;
      padding: 0.15rem 0.6rem;
    }
    .tag-vision { font-size: 0.67rem; color: var(--surface-muted); }
    .agent-disclaimer { font-size: 0.7rem; color: var(--surface-muted); margin-top: 0.65rem; line-height: 1.5; padding-top: 0.65rem; border-top: 1px solid var(--surface-border); }
    .agent-reasoning-toggle { font-size: 0.7rem; color: var(--surface-muted); background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; padding: 0; margin-left: auto; transition: color 0.12s; }
    .agent-reasoning-toggle:hover { color: var(--surface-text); }
    .agent-reasoning { font-size: 0.775rem; color: var(--surface-muted); line-height: 1.6; margin-top: 0.65rem; padding-top: 0.65rem; border-top: 1px solid var(--surface-border); display: none; }
    .agent-reasoning.open { display: block; }

    /* Typing indicator */
    .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 0.75rem 1rem; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-muted); animation: bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }

    /* Input bar */
    .input-bar {
      padding: 1rem 2.5rem 1.5rem;
      background: var(--bg);
      border-top: 1px solid rgba(45,57,50,0.3);
    }
    .input-wrap { display: flex; gap: 0.75rem; align-items: flex-end; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 12px; padding: 0.65rem 0.75rem; transition: border-color 0.15s; }
    .input-wrap:focus-within { border-color: var(--sage); }
    #msg-input {
      flex: 1; font-family: 'Inter', sans-serif; font-size: 0.875rem;
      color: var(--surface-text); background: none; border: none; outline: none;
      resize: none; line-height: 1.5; max-height: 120px; min-height: 24px;
    }
    #msg-input::placeholder { color: var(--surface-muted); }
    .btn-send {
      font-family: 'Inter', sans-serif; font-size: 0.775rem; font-weight: 500;
      color: var(--surface-text); background: var(--sage-dark); border: none;
      border-radius: 8px; padding: 0.4rem 0.9rem; cursor: pointer; white-space: nowrap;
      transition: background 0.15s; align-self: flex-end;
    }
    .btn-send:hover { background: var(--sage); }
    .btn-send:disabled { background: var(--surface-border); color: var(--surface-muted); cursor: wait; }
  </style>
</head>
<body>

  <nav class="sidebar">
    <div class="sidebar-top">
      <span class="logo">Personal CFO</span>
      <button class="btn-new" onclick="newConversation()">+ New conversation</button>
    </div>
    <div class="nav-links">
      <p class="nav-label">Tools</p>
      <a href="/static/vault.html" class="nav-link">Vault</a>
      <a href="/static/scenarios.html" class="nav-link">Scenarios</a>
      <a href="/static/digest.html" class="nav-link">Digest</a>
      <a href="/static/settings.html" class="nav-link">Settings</a>
    </div>
    <div class="sidebar-bottom">
      <button class="btn-signout" onclick="signOut()">Sign out</button>
    </div>
  </nav>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <p class="empty-title">What do you want to know?</p>
        <p class="empty-sub">Your CFO has a point of view. Ask anything about your finances,<br>career, or path to $1M.</p>
        <div class="starters">
          <button class="starter" onclick="useStarter(this)">
            <p class="starter-label">Financial position</p>
            Where do I stand financially right now?
          </button>
          <button class="starter" onclick="useStarter(this)">
            <p class="starter-label">Strategy</p>
            What's my single highest-leverage move right now?
          </button>
          <button class="starter" onclick="useStarter(this)">
            <p class="starter-label">Goal projection</p>
            How long until I hit $1M at my current trajectory?
          </button>
          <button class="starter" onclick="useStarter(this)">
            <p class="starter-label">Career</p>
            Am I leaving money on the table in my career?
          </button>
        </div>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="msg-input" rows="1" placeholder="Ask your CFO anything…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn-send" id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('cfo_token');
    if (!token) window.location.href = '/static/login.html';

    // Bounce to intake if not yet completed
    (async () => {
      try {
        const r = await fetch('/intake/status', { headers: { Authorization: 'Bearer ' + token } });
        if (r.ok) { const d = await r.json(); if (!d.intake_completed) window.location.href = '/static/intake.html'; }
      } catch (_) {}
    })();

    let conversationId = parseInt(localStorage.getItem('cfo_conversation_id')) || null;
    let isThinking = false;

    // Restore last conversation from DB on mount
    (async () => {
      if (!conversationId) return;
      try {
        const r = await fetch(`/memory/conversations/${conversationId}/messages`, {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (!r.ok) { localStorage.removeItem('cfo_conversation_id'); conversationId = null; return; }
        const messages = await r.json();
        if (!messages.length) return;
        const msgs = document.getElementById('messages');
        const empty = document.getElementById('empty-state');
        if (empty) empty.remove();
        for (const msg of messages) {
          if (msg.role === 'user') {
            appendUserMessage(msg.content);
          } else {
            appendAgentMessage({
              recommendation: msg.content,
              principle: msg.cited_principle || '',
              vision_stamp: '',
              reasoning: '',
              disclaimer: null,
            });
          }
        }
      } catch (_) { conversationId = null; }
    })();

    function newConversation() {
      conversationId = null;
      localStorage.removeItem('cfo_conversation_id');
      const msgs = document.getElementById('messages');
      msgs.innerHTML = `<div class="empty-state" id="empty-state">
        <p class="empty-title">What do you want to know?</p>
        <p class="empty-sub">Your CFO has a point of view. Ask anything about your finances,<br>career, or path to $1M.</p>
        <div class="starters">
          <button class="starter" onclick="useStarter(this)"><p class="starter-label">Financial position</p>Where do I stand financially right now?</button>
          <button class="starter" onclick="useStarter(this)"><p class="starter-label">Strategy</p>What's my single highest-leverage move right now?</button>
          <button class="starter" onclick="useStarter(this)"><p class="starter-label">Goal projection</p>How long until I hit $1M at my current trajectory?</button>
          <button class="starter" onclick="useStarter(this)"><p class="starter-label">Career</p>Am I leaving money on the table in my career?</button>
        </div>
      </div>`;
    }

    function useStarter(btn) {
      const text = btn.innerText.replace(btn.querySelector('.starter-label').innerText, '').trim();
      document.getElementById('msg-input').value = text;
      sendMessage();
    }

    function handleKey(evt) {
      if (evt.key === 'Enter' && !evt.shiftKey) { evt.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function signOut() {
      localStorage.removeItem('cfo_token');
      window.location.href = '/static/login.html';
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const btn = document.getElementById('send-btn');
      const text = input.value.trim();
      if (!text || isThinking) return;

      // Remove empty state
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      isThinking = true;
      btn.disabled = true;
      input.value = '';
      input.style.height = 'auto';

      appendUserMessage(text);
      const typingEl = appendTyping();

      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ message: text, conversation_id: conversationId }),
        });

        typingEl.remove();

        if (resp.status === 401) { signOut(); return; }
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          appendError(err.detail || 'Something went wrong. Try again.');
          return;
        }

        const data = await resp.json();
        conversationId = data.conversation_id;
        localStorage.setItem('cfo_conversation_id', conversationId);
        appendAgentMessage(data);
      } catch (e) {
        typingEl.remove();
        appendError('Network error — is the server running?');
      } finally {
        isThinking = false;
        btn.disabled = false;
        input.focus();
      }
    }

    function appendUserMessage(text) {
      const msgs = document.getElementById('messages');
      const row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML = `<div class="bubble-user">${escHtml(text)}</div>`;
      msgs.appendChild(row);
      scrollToBottom();
    }

    function appendTyping() {
      const msgs = document.getElementById('messages');
      const row = document.createElement('div');
      row.className = 'msg-row agent';
      row.innerHTML = `<div class="agent-card"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
      msgs.appendChild(row);
      scrollToBottom();
      return row;
    }

    function appendAgentMessage(data) {
      const msgs = document.getElementById('messages');
      const row = document.createElement('div');
      row.className = 'msg-row agent';

      const reasoningId = 'r-' + Date.now();
      const hasDisclaimer = data.disclaimer && data.disclaimer.trim();
      const hasReasoning = data.reasoning && data.reasoning.trim();

      row.innerHTML = `
        <div class="agent-card">
          <div class="agent-recommendation">${renderMarkdown(data.recommendation)}</div>
          <div class="agent-meta">
            ${data.principle ? `<span class="tag-principle">${escHtml(data.principle)}</span>` : ''}
            ${data.vision_stamp ? `<span class="tag-vision">${escHtml(data.vision_stamp)}</span>` : ''}
            ${hasReasoning ? `<button class="agent-reasoning-toggle" onclick="toggleReasoning('${reasoningId}', this)">Show reasoning</button>` : ''}
          </div>
          ${hasReasoning ? `<div class="agent-reasoning" id="${reasoningId}">${renderMarkdown(data.reasoning)}</div>` : ''}
          ${hasDisclaimer ? `<div class="agent-disclaimer">${escHtml(data.disclaimer)}</div>` : ''}
        </div>`;
      msgs.appendChild(row);
      scrollToBottom();
    }

    function appendError(msg) {
      const msgs = document.getElementById('messages');
      const row = document.createElement('div');
      row.className = 'msg-row agent';
      row.innerHTML = `<div class="agent-card"><div class="agent-recommendation" style="color:#C47A7A">${escHtml(msg)}</div></div>`;
      msgs.appendChild(row);
      scrollToBottom();
    }

    function toggleReasoning(id, btn) {
      const el = document.getElementById(id);
      el.classList.toggle('open');
      btn.textContent = el.classList.contains('open') ? 'Hide reasoning' : 'Show reasoning';
    }

    function scrollToBottom() {
      const msgs = document.getElementById('messages');
      msgs.scrollTop = msgs.scrollHeight;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderMarkdown(text) {
      return escHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n\n/g, '</p><p style="margin-top:0.6em">')
        .replace(/\n/g, '<br>');
    }
  </script>
</body>
</html>
