<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Digest — Personal CFO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; font-weight: 300; background: radial-gradient(ellipse at 20% 0%, #131f18 0%, #0d1511 55%); color: #dce8e0; padding: 2rem; max-width: 720px; margin: auto; min-height: 100vh; }
    h1 { font-size: 1.4rem; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    .subtitle { color: #607a6c; font-size: 0.875rem; margin-bottom: 2rem; }
    .btn { display: inline-block; padding: 0.55rem 1.5rem; background: #3e7859; color: #dce8e0; border: none; border-radius: 8px; cursor: pointer; font-size: 0.875rem; font-family: 'Inter', sans-serif; font-weight: 500; margin-bottom: 1.5rem; transition: background 0.15s; }
    .btn:hover { background: #4e8c6a; }
    .btn:disabled { background: #253830; color: #607a6c; cursor: wait; }
    #digest-body { background: #162019; border: 1px solid #253830; border-radius: 16px; padding: 1.75rem; line-height: 1.75; font-size: 0.9rem; min-height: 200px; color: #c0d8c8; }
    #digest-body h1, #digest-body h2, #digest-body h3 { font-family: 'Inter', sans-serif; font-weight: 500; color: #93b3a2; margin: 1.25rem 0 0.5rem; letter-spacing: -0.01em; }
    #digest-body hr { border: none; border-top: 1px solid #253830; margin: 1rem 0; }
    #status { font-size: 0.825rem; color: #607a6c; margin-bottom: 0.75rem; }
    .error { color: #7a4a4a; }
  </style>
</head>
<body>
  <h1>Weekly Digest</h1>
  <p class="subtitle">Your personal CFO summary. Runs every Monday at 07:00 UTC.</p>

  <button class="btn" id="send-btn" onclick="runDigest()">Send Digest Now</button>
  <div id="status"></div>
  <div id="digest-body">Loading…</div>

  <script>
    const token = localStorage.getItem("cfo_token");

    async function load() {
      // Try to show the last digest if stored in sessionStorage
      const cached = sessionStorage.getItem("cfo_digest");
      if (cached) {
        renderBody(cached);
      } else {
        document.getElementById("digest-body").textContent = "No digest yet. Click 'Send Digest Now' to generate one.";
      }
    }

    async function runDigest() {
      const btn = document.getElementById("send-btn");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.textContent = "Generating and sending digest…";

      try {
        const resp = await fetch("/digest/run-now", {
          method: "POST",
          headers: token ? { Authorization: "Bearer " + token } : {},
        });
        if (resp.status === 401) { status.innerHTML = '<span class="error">Session expired. Log in again.</span>'; return; }
        const data = await resp.json();
        if (!resp.ok) { status.innerHTML = `<span class="error">${data.detail || "Error sending digest"}</span>`; return; }
        status.textContent = "Digest sent ✓";
        sessionStorage.setItem("cfo_digest", data.body);
        renderBody(data.body);
      } catch (e) {
        status.innerHTML = `<span class="error">Network error: ${e.message}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    function renderBody(markdown) {
      // Minimal markdown → HTML: headers and horizontal rules
      let html = markdown
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/^---$/gm, '<hr>')
        .replace(/\n/g, '<br>');
      document.getElementById("digest-body").innerHTML = html;
    }

    load();
  </script>
</body>
</html>
