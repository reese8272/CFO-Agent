<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Digest — Personal CFO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #E4EDE6; --surface: #252B28; --surface-text: #C8D8CC; --surface-muted: #7A9A87; --surface-border: #363F3B;
      --border: #D4DDD6; --border-light: #E8EDE9;
      --sage-xs: #EEF3EF; --sage-light: #B8CCBB; --sage: #7A9B83; --sage-dark: #4D5E58;
      --text: #2E3D36; --text-muted: #7A9585; --text-dim: #A8BDB2;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; display: flex; }

    /* Sidebar */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--surface-border);
      display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
    }
    .sidebar-top { padding: 1.25rem 1rem 1rem; border-bottom: 1px solid var(--surface-border); }
    .logo { font-size: 0.875rem; font-weight: 600; color: var(--sage-light); letter-spacing: -0.02em; display: block; text-decoration: none; }
    .nav-links { padding: 1rem 0; flex: 1; }
    .nav-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--surface-muted); padding: 0 1rem; margin: 0.75rem 0 0.3rem; opacity: 0.6; }
    .nav-link {
      display: block; padding: 0.38rem 1rem 0.38rem 1.25rem;
      font-size: 0.8rem; color: var(--surface-muted); text-decoration: none;
      border-left: 2px solid transparent; transition: color 0.1s, background 0.1s;
    }
    .nav-link:hover { color: var(--surface-text); background: rgba(255,255,255,0.05); }
    .nav-link.active { color: var(--surface-text); font-weight: 500; border-left-color: var(--sage); background: rgba(255,255,255,0.06); }
    .sidebar-bottom { padding: 1rem; border-top: 1px solid var(--surface-border); }
    .btn-signout { font-family: 'Inter', sans-serif; font-size: 0.75rem; color: var(--surface-muted); background: none; border: none; cursor: pointer; padding: 0; transition: color 0.12s; }
    .btn-signout:hover { color: var(--surface-text); }

    /* Main content */
    .main-area { flex: 1; overflow-y: auto; }
    .page-wrap { max-width: 680px; padding: 2.5rem 2rem 4rem; }

    h1 { font-size: 1.1rem; font-weight: 600; color: var(--sage-dark); letter-spacing: -0.02em; margin-bottom: 0.2rem; }
    .subtitle { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 1.75rem; }
    .btn { display: inline-block; padding: 0.45rem 1.25rem; background: var(--sage-dark); color: var(--surface-text); border: none; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-family: 'Inter', sans-serif; font-weight: 500; margin-bottom: 1.25rem; transition: background 0.15s; }
    .btn:hover { background: var(--sage); }
    .btn:disabled { background: var(--border); color: var(--text-dim); cursor: wait; }
    #digest-body { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 12px; padding: 1.75rem; line-height: 1.75; font-size: 0.875rem; min-height: 200px; color: var(--surface-text); }
    #digest-body h1, #digest-body h2, #digest-body h3 { font-family: 'Inter', sans-serif; font-weight: 500; color: var(--sage-light); margin: 1.25rem 0 0.4rem; letter-spacing: -0.01em; }
    #digest-body hr { border: none; border-top: 1px solid var(--border-light); margin: 1rem 0; }
    #status { font-size: 0.775rem; color: var(--text-dim); margin-bottom: 0.65rem; }
    .error { color: #A05050; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-top">
      <a href="/static/chat.html" class="logo">Personal CFO</a>
    </div>
    <div class="nav-links">
      <span class="nav-label">Navigate</span>
      <a href="/static/chat.html" class="nav-link">Chat</a>
      <a href="/static/vault.html" class="nav-link">Vault</a>
      <a href="/static/scenarios.html" class="nav-link">Scenarios</a>
      <a href="/static/digest.html" class="nav-link active">Digest</a>
      <a href="/static/settings.html" class="nav-link">Settings</a>
    </div>
    <div class="sidebar-bottom">
      <button class="btn-signout" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="main-area">
    <div class="page-wrap">
      <h1>Weekly Digest</h1>
      <p class="subtitle">Your personal CFO summary. Runs every Monday at 07:00 UTC.</p>
      <button class="btn" id="send-btn" onclick="runDigest()">Send Digest Now</button>
      <div id="status"></div>
      <div id="digest-body">Loading…</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("cfo_token");
    if (!token) window.location.href = '/static/login.html';

    function signOut() {
      localStorage.removeItem('cfo_token');
      window.location.href = '/static/login.html';
    }

    async function load() {
      const cached = sessionStorage.getItem("cfo_digest");
      if (cached) renderBody(cached);
      else document.getElementById("digest-body").textContent = "No digest yet. Click 'Send Digest Now' to generate one.";
    }

    async function runDigest() {
      const btn = document.getElementById("send-btn");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.textContent = "Generating and sending digest…";
      try {
        const resp = await fetch("/digest/run-now", { method: "POST", headers: { Authorization: "Bearer " + token } });
        if (resp.status === 401) { window.location.href = '/static/login.html'; return; }
        const data = await resp.json();
        if (!resp.ok) { status.innerHTML = `<span class="error">${data.detail || "Error sending digest"}</span>`; return; }
        status.textContent = "Digest sent ✓";
        sessionStorage.setItem("cfo_digest", data.body);
        renderBody(data.body);
      } catch (e) {
        status.innerHTML = `<span class="error">Network error: ${e.message}</span>`;
      } finally { btn.disabled = false; }
    }

    function renderBody(markdown) {
      let html = markdown
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/^---$/gm, '<hr>')
        .replace(/\n/g, '<br>');
      document.getElementById("digest-body").innerHTML = html;
    }

    load();
  </script>
</body>
</html>
