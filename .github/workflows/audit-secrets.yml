name: Audit Secrets

# Run manually any time to see what secrets are configured — no deploy triggered.
# Results are posted as a GitHub issue so you (and Claude) can read them directly.
#
# Actions → "Audit Secrets" → Run workflow → Run workflow

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      issues: write   # needed to create/update the audit issue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run secret audit and post results to GitHub Issues
        env:
          # Feed every secret into the environment so the script can read them.
          # GitHub masks exact values in logs; the script only prints metadata.
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          JWT_SECRET_KEY:         ${{ secrets.JWT_SECRET_KEY }}
          VAULT_ENCRYPTION_KEY:   ${{ secrets.VAULT_ENCRYPTION_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SSH_PRIVATE_KEY:        ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST:            ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER:            ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH:            ${{ secrets.DEPLOY_PATH }}
          GH_PAT:                 ${{ secrets.GH_PAT }}
          SMTP_HOST:              ${{ secrets.SMTP_HOST }}
          SMTP_USER:              ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:          ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:              ${{ secrets.SMTP_FROM }}
          RENTCAST_API_KEY:       ${{ secrets.RENTCAST_API_KEY }}
          ALPHA_VANTAGE_KEY:      ${{ secrets.ALPHA_VANTAGE_KEY }}
          # GitHub built-ins for issue posting
          GITHUB_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:      ${{ github.repository }}
        run: python scripts/audit_secrets.py --post-issue
        # Always exit 0 here — we want to see the issue even when secrets are missing.
        # The issue itself will show failures clearly.
        continue-on-error: true
