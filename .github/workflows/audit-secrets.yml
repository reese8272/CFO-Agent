name: Audit Secrets

# Run this manually any time you want to verify what secrets are configured
# without triggering a real deploy. Safe to run publicly — no secret values
# are ever printed; only metadata (length, prefix, format validity).
#
# How to run: Actions → "Audit Secrets" → Run workflow → Run workflow

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: "CI secrets (no environment gate)"
        env:
          _JWT: ${{ secrets.JWT_SECRET_KEY }}
          _ANT: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              CFO-Agent — Secret Audit Report                ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Legend: ✓ OK   ✗ Missing/broken   ⚠ Set but suspicious"
          echo ""

          # ── Helpers ──────────────────────────────────────────────────────
          report_required() {
            local label="$1" val="$2" min="${3:-1}"
            local len="${#val}"
            printf "%-32s" "$label"
            if   [ "$len" -eq 0 ];         then echo "✗  NOT SET"
            elif [ "$len" -lt "$min" ];    then echo "⚠  SET but short: ${len} chars (need ≥${min})"
            else                                echo "✓  ${len} chars"
            fi
          }

          report_prefix() {
            local label="$1" val="$2" prefix="$3"
            local len="${#val}"
            printf "%-32s" "$label"
            if [ "$len" -eq 0 ]; then
              echo "✗  NOT SET"
              return
            fi
            local actual
            actual=$(printf '%s' "$val" | cut -c1-${#prefix})
            if [ "$actual" = "$prefix" ]; then
              echo "✓  ${len} chars  prefix=${prefix}✓"
            else
              echo "⚠  ${len} chars  expected prefix '${prefix}' — verify key is correct"
            fi
          }

          report_fernet() {
            local label="$1" val="$2"
            local len="${#val}"
            printf "%-32s" "$label"
            if [ "$len" -eq 0 ]; then
              echo "✗  NOT SET — encrypted vault data UNREADABLE if deployed"
              return
            fi
            if [ "$len" -eq 44 ]; then
              echo "✓  ${len} chars  (correct Fernet length)"
            else
              echo "⚠  ${len} chars  (Fernet keys are exactly 44 chars — re-generate if wrong)"
            fi
          }

          report_ssh_key() {
            local label="$1" val="$2"
            local len="${#val}"
            printf "%-32s" "$label"
            if [ "$len" -eq 0 ]; then
              echo "✗  NOT SET"
              return
            fi
            # Write to temp file to check validity
            printf '%s' "$val" > /tmp/_audit_key
            chmod 600 /tmp/_audit_key
            local lines
            lines=$(wc -l < /tmp/_audit_key)
            local fingerprint
            fingerprint=$(ssh-keygen -l -f /tmp/_audit_key 2>&1 | head -1 || echo "parse error")
            rm -f /tmp/_audit_key
            if echo "$fingerprint" | grep -q "parse error\|invalid"; then
              echo "⚠  ${len} chars, ${lines} lines — key INVALID (check newlines when pasting)"
            else
              echo "✓  ${len} chars, ${lines} lines — fingerprint: $fingerprint"
            fi
          }

          report_optional() {
            local label="$1" val="$2" feature="$3"
            local len="${#val}"
            printf "%-32s" "$label"
            if [ "$len" -eq 0 ]; then
              echo "–  NOT SET  (disables: ${feature})"
            else
              echo "✓  ${len} chars"
            fi
          }

          # ── Tier 1: App won't start without these ─────────────────────
          echo "── Tier 1: Required (app won't start) ──────────────────────────"
          report_prefix  "ANTHROPIC_API_KEY"    "$_ANT" "sk-ant-"
          report_required "JWT_SECRET_KEY"       "$_JWT" 32
          echo ""

      - name: "Production environment secrets"
        env:
          _ANT: ${{ secrets.ANTHROPIC_API_KEY }}
          _JWT: ${{ secrets.JWT_SECRET_KEY }}
          _FERNET: ${{ secrets.VAULT_ENCRYPTION_KEY }}
          _CF: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          _HOST: ${{ secrets.DEPLOY_HOST }}
          _USER: ${{ secrets.DEPLOY_USER }}
          _KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          _PAT: ${{ secrets.GH_PAT }}
          _PATH: ${{ secrets.DEPLOY_PATH }}
          _SMTP_HOST: ${{ secrets.SMTP_HOST }}
          _SMTP_USER: ${{ secrets.SMTP_USER }}
          _SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
          _SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          report_required() {
            local label="$1" val="$2" min="${3:-1}"
            local len="${#val}"
            printf "%-32s" "$label"
            if   [ "$len" -eq 0 ];       then echo "✗  NOT SET"
            elif [ "$len" -lt "$min" ];  then echo "⚠  SET but short: ${len} chars (need ≥${min})"
            else                              echo "✓  ${len} chars"
            fi
          }

          report_prefix() {
            local label="$1" val="$2" prefix="$3"
            local len="${#val}"
            printf "%-32s" "$label"
            if [ "$len" -eq 0 ]; then echo "✗  NOT SET"; return; fi
            local actual
            actual=$(printf '%s' "$val" | cut -c1-${#prefix})
            if [ "$actual" = "$prefix" ]; then echo "✓  ${len} chars  prefix=${prefix}✓"
            else echo "⚠  ${len} chars  expected prefix '${prefix}'"; fi
          }

          report_fernet() {
            local label="$1" val="$2"
            local len="${#val}"
            printf "%-32s" "$label"
            if [ "$len" -eq 0 ]; then echo "✗  NOT SET — vault data UNREADABLE if deployed"; return; fi
            if [ "$len" -eq 44 ]; then echo "✓  ${len} chars  (correct Fernet length)"
            else echo "⚠  ${len} chars  (Fernet keys are exactly 44 chars)"; fi
          }

          report_optional() {
            local label="$1" val="$2" feature="$3"
            local len="${#val}"
            printf "%-32s" "$label"
            if [ "$len" -eq 0 ]; then echo "–  NOT SET  (disables: ${feature})"
            else echo "✓  ${len} chars"; fi
          }

          echo "── Tier 1: Required (app won't start) ──────────────────────────"
          report_prefix   "ANTHROPIC_API_KEY"    "$_ANT"    "sk-ant-"
          report_required "JWT_SECRET_KEY"        "$_JWT"    32
          report_fernet   "VAULT_ENCRYPTION_KEY"  "$_FERNET"
          echo ""

          echo "── Tier 2: SMTP (digest emails) ────────────────────────────────"
          report_optional "SMTP_HOST"             "$_SMTP_HOST" "weekly digest email"
          report_optional "SMTP_USER"             "$_SMTP_USER" "weekly digest email"
          report_optional "SMTP_PASSWORD"         "$_SMTP_PASS" "weekly digest email"
          report_optional "SMTP_FROM"             "$_SMTP_FROM" "weekly digest email"
          echo ""

          echo "── Tier 3: Deployment ──────────────────────────────────────────"
          report_required "CLOUDFLARE_TUNNEL_TOKEN" "$_CF"
          report_required "DEPLOY_HOST"           "$_HOST"
          report_required "DEPLOY_USER"           "$_USER"
          report_required "DEPLOY_PATH"           "$_PATH"
          report_required "GH_PAT"               "$_PAT"

          # SSH key: write and validate without printing value
          SSH_LEN="${#_KEY}"
          printf "%-32s" "SSH_PRIVATE_KEY"
          if [ "$SSH_LEN" -eq 0 ]; then
            echo "✗  NOT SET"
          else
            printf '%s' "$_KEY" > /tmp/_audit_key
            chmod 600 /tmp/_audit_key
            SSH_LINES=$(wc -l < /tmp/_audit_key)
            SSH_FP=$(ssh-keygen -l -f /tmp/_audit_key 2>&1 | head -1 || echo "parse error")
            rm -f /tmp/_audit_key
            if echo "$SSH_FP" | grep -qiE "parse error|invalid|no such"; then
              echo "⚠  ${SSH_LEN} chars, ${SSH_LINES} lines — key INVALID (newlines stripped when pasting?)"
            else
              echo "✓  ${SSH_LEN} chars, ${SSH_LINES} lines — $SSH_FP"
            fi
          fi
          echo ""

          echo "── Tier 4: Optional feature gates ──────────────────────────────"
          RENTCAST_LEN=0  # not available in this job — report as unknown
          printf "%-32s" "RENTCAST_API_KEY"
          echo "–  (add as a secret to report here)"
          printf "%-32s" "ALPHA_VANTAGE_KEY"
          echo "–  (add as a secret to report here)"
          echo ""

          echo "── Summary ──────────────────────────────────────────────────────"
          MISSING=0
          for v in "$_ANT" "$_JWT" "$_FERNET" "$_CF" "$_HOST" "$_USER" "$_KEY" "$_PAT" "$_PATH"; do
            [ "${#v}" -eq 0 ] && MISSING=$((MISSING+1))
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "✓ All required secrets are set. Run 'Deploy' workflow when ready."
          else
            echo "✗ ${MISSING} required secret(s) missing."
            echo "  Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "  See: docs/ENV_CHECKLIST.md for generation instructions."
          fi

      - name: "SSH connectivity test (bonus)"
        env:
          _HOST: ${{ secrets.DEPLOY_HOST }}
          _USER: ${{ secrets.DEPLOY_USER }}
          _KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          HOST=$(printf '%s' "$_HOST" | tr -d '[:space:]')
          USER=$(printf '%s' "$_USER" | tr -d '[:space:]')
          KEY_LEN="${#_KEY}"

          echo "── SSH Connectivity ─────────────────────────────────────────────"
          if [ "$KEY_LEN" -eq 0 ] || [ -z "$HOST" ]; then
            echo "  Skipping — DEPLOY_HOST or SSH_PRIVATE_KEY not set"
            exit 0
          fi

          echo "  Host: $HOST"
          echo "  User: $USER"
          echo ""

          echo "  Port 22 scan..."
          nc -zv -w 10 "$HOST" 22 \
            && echo "  ✓ port 22 OPEN" \
            || echo "  ✗ port 22 unreachable"

          echo ""
          echo "  SSH handshake attempt..."
          printf '%s' "$_KEY" > /tmp/_audit_key
          chmod 600 /tmp/_audit_key
          ssh -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -i /tmp/_audit_key \
              "$USER@$HOST" \
              'echo "  ✓ Connected as $(whoami) on $(hostname)"' 2>&1 \
          || echo "  ✗ SSH failed (exit $?) — run debug-ssh.yml for full verbose output"
          rm -f /tmp/_audit_key
