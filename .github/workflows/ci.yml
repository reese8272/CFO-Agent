name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cfo
          POSTGRES_PASSWORD: cfo
          POSTGRES_DB: personal_cfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cfo -d personal_cfo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://cfo:cfo@localhost:5432/personal_cfo
      REDIS_URL: redis://localhost:6379/0
      # JWT_SECRET_KEY: real secret if set, otherwise a safe 32-char CI placeholder
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-secret-key-must-be-at-least-32-chars' }}
      # ANTHROPIC_API_KEY: real key enables live LLM tests; 'test-key' stubs them
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'test-key' }}
      DIGEST_RECIPIENT: ci@example.com
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: test
      SMTP_PASSWORD: test
      SMTP_FROM: noreply@example.com

    steps:
      - uses: actions/checkout@v4

      # ── Python setup ────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: venv-${{ runner.os }}-py3.13-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/.venv
          ~/.venv/bin/pip install -r requirements.txt

      - name: Add venv to PATH
        run: echo "$HOME/.venv/bin" >> $GITHUB_PATH

      # ── Generate ephemeral secrets for CI ───────────────────────────────────
      - name: Generate VAULT_ENCRYPTION_KEY for CI
        run: |
          KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "VAULT_ENCRYPTION_KEY=${KEY}" >> $GITHUB_ENV
          echo "VAULT_ENCRYPTION_KEY: generated OK ($(echo -n "$KEY" | wc -c) chars)"

      # ── Audit secrets available to this CI run ──────────────────────────────
      - name: Audit CI secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'test-key' }}
          JWT_SECRET_KEY:    ${{ secrets.JWT_SECRET_KEY || 'ci-test-secret-key-must-be-at-least-32-chars' }}
        run: python scripts/audit_secrets.py
        # Non-blocking — CI env uses placeholders for missing secrets by design.
        continue-on-error: true

      # ── Migrations ──────────────────────────────────────────────────────────
      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Verify migration is at head
        run: |
          CURRENT=$(alembic current 2>&1)
          echo "Alembic current: $CURRENT"
          if echo "$CURRENT" | grep -q "(head)"; then
            echo "✓ Migrations are at head"
          else
            echo "✗ Migrations did NOT reach head — check output above"
            exit 1
          fi

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: Run tests
        run: |
          mkdir -p test-results
          pytest -v --tb=long --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 14
