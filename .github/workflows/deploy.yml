name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: []  # add 'test' from ci.yml once you merge CI into a reusable workflow

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            # Install Docker if missing
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker "$USER"
            fi

            # Group membership may not be active in this session yet; use sudo as fallback
            DOCKER="docker"
            if ! groups | grep -q docker; then
              DOCKER="sudo docker"
            fi

            GH_TOKEN="${{ secrets.GH_PAT }}"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/reese8272/CFO-Agent.git"

            # Bootstrap repo on first deploy
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              git clone "${REPO_URL}" ${{ secrets.DEPLOY_PATH }}
            fi

            cd ${{ secrets.DEPLOY_PATH }}
            git remote set-url origin "${REPO_URL}"
            git pull origin main

            # Write .env from secrets (safe to re-run — overwrites each deploy)
            cat > .env <<'ENVEOF'
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            DATABASE_URL=postgresql+psycopg://cfo:cfo@postgres:5432/personal_cfo
            REDIS_URL=redis://redis:6379/0
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            VAULT_ENCRYPTION_KEY=${{ secrets.VAULT_ENCRYPTION_KEY }}
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            SMTP_HOST=
            SMTP_PORT=587
            SMTP_USER=
            SMTP_PASSWORD=
            SMTP_FROM=
            DIGEST_RECIPIENT=reesepludwick@gmail.com
            JWT_EXPIRY_MINUTES=60
            LLM_TIMEOUT_SECONDS=120
            ENV=production
            LANGGRAPH_CHECKPOINT_BACKEND=redis
            ALERT_DRIFT_PCT_THRESHOLD=25
            ALERT_INCOME_DROP_PCT_THRESHOLD=30
            POSTGRES_USER=cfo
            POSTGRES_PASSWORD=cfo
            POSTGRES_DB=personal_cfo
            ENVEOF

            $DOCKER compose pull

            # Only rebuild the image if Dockerfile or dependencies changed
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(Dockerfile|requirements\.txt)'; then
              echo "Dockerfile/requirements changed — rebuilding image..."
              $DOCKER compose up -d --build --remove-orphans

              echo "Waiting for app to be healthy..."
              for i in $(seq 1 36); do
                STATUS=$($DOCKER inspect --format='{{.State.Health.Status}}' cfo-agent-app-1 2>/dev/null || echo "missing")
                echo "  attempt $i: health=$STATUS"
                if [ "$STATUS" = "healthy" ]; then break; fi
                if [ "$i" = "36" ]; then
                  echo "App did not become healthy in time. Last known status: $STATUS"
                  $DOCKER compose logs --tail 50 app
                  exit 1
                fi
                sleep 5
              done
            else
              echo "No image changes — skipping rebuild."
              $DOCKER compose up -d --remove-orphans
            fi

            # Only run migrations if migration files changed
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^migrations/'; then
              echo "Migrations changed — upgrading..."
              $DOCKER compose exec -T app alembic upgrade head
            else
              echo "No migration changes — skipping alembic."
            fi

            $DOCKER compose ps
