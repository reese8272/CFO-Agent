name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "manual trigger"

jobs:
  # ── Job 1: Validate all required secrets before doing any real work ──────────
  validate-secrets:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate deployment secrets
        env:
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          JWT_SECRET_KEY:          "auto-generated-per-deploy"
          VAULT_ENCRYPTION_KEY:    ${{ secrets.VAULT_ENCRYPTION_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SSH_PRIVATE_KEY:         ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST:             ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER:             ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH:             ${{ secrets.DEPLOY_PATH }}
          GH_PAT:                  ${{ secrets.GH_PAT }}
          SMTP_HOST:               ${{ secrets.SMTP_HOST }}
          SMTP_USER:               ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:           ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:               ${{ secrets.SMTP_FROM }}
        run: python scripts/audit_secrets.py

  # ── Job 2: Build and push Docker image to GHCR ───────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [validate-secrets]
    permissions:
      contents: read
      packages: write

    outputs:
      image: ghcr.io/reese8272/cfo-agent:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/reese8272/cfo-agent:latest
            ghcr.io/reese8272/cfo-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to server via SSH ──────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: [build]

    steps:
      - name: Sanitize deploy host
        id: host
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          echo "value=$(printf '%s' "$HOST" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Passed as env vars so they never appear as interpolated text in the script.
          # appleboy/ssh-action forwards these to the remote shell via its envs: list.
          SECRET_ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          SECRET_VAULT_ENCRYPTION_KEY:    ${{ secrets.VAULT_ENCRYPTION_KEY }}
          SECRET_CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SECRET_GH_PAT:                  ${{ secrets.GH_PAT }}
          SECRET_DEPLOY_PATH:             ${{ secrets.DEPLOY_PATH }}
          SECRET_SMTP_HOST:               ${{ secrets.SMTP_HOST }}
          SECRET_SMTP_PORT:               ${{ secrets.SMTP_PORT }}
          SECRET_SMTP_USER:               ${{ secrets.SMTP_USER }}
          SECRET_SMTP_PASSWORD:           ${{ secrets.SMTP_PASSWORD }}
          SECRET_SMTP_FROM:               ${{ secrets.SMTP_FROM }}
          DEPLOY_SHA:                     ${{ github.sha }}
        with:
          host: ${{ steps.host.outputs.value }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: SECRET_ANTHROPIC_API_KEY,SECRET_VAULT_ENCRYPTION_KEY,SECRET_CLOUDFLARE_TUNNEL_TOKEN,SECRET_GH_PAT,SECRET_DEPLOY_PATH,SECRET_SMTP_HOST,SECRET_SMTP_PORT,SECRET_SMTP_USER,SECRET_SMTP_PASSWORD,SECRET_SMTP_FROM,DEPLOY_SHA
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            DOCKER="docker"
            if ! groups | grep -q docker; then
              DOCKER="sudo docker"
            fi

            echo "=== [1/6] Syncing repo ==="
            REPO_URL="https://x-access-token:${SECRET_GH_PAT}@github.com/reese8272/CFO-Agent.git"
            if [ ! -d "${SECRET_DEPLOY_PATH}/.git" ]; then
              git clone "${REPO_URL}" "${SECRET_DEPLOY_PATH}"
            fi
            cd "${SECRET_DEPLOY_PATH}"
            git remote set-url origin "${REPO_URL}"
            git fetch origin main
            git reset --hard origin/main
            echo "  Repo at: $(git log -1 --oneline)"

            echo ""
            echo "=== [2/6] Writing .env ==="
            if [ -z "${SECRET_VAULT_ENCRYPTION_KEY}" ]; then
              echo "VAULT_ENCRYPTION_KEY is not set — aborting. See docs/ENV_CHECKLIST.md."
              exit 1
            fi
            JWT_KEY=$(openssl rand -hex 32)
            echo "  JWT_SECRET_KEY: generated fresh ✓"
            {
              printf 'ANTHROPIC_API_KEY=%s\n'       "${SECRET_ANTHROPIC_API_KEY}"
              printf 'VAULT_ENCRYPTION_KEY=%s\n'    "${SECRET_VAULT_ENCRYPTION_KEY}"
              printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "${SECRET_CLOUDFLARE_TUNNEL_TOKEN}"
              printf 'JWT_SECRET_KEY=%s\n'           "${JWT_KEY}"
              printf 'DATABASE_URL=%s\n'             "postgresql+psycopg://cfo:cfo@postgres:5432/personal_cfo"
              printf 'REDIS_URL=%s\n'                "redis://redis:6379/0"
              printf 'SMTP_HOST=%s\n'                "${SECRET_SMTP_HOST}"
              printf 'SMTP_PORT=%s\n'                "${SECRET_SMTP_PORT:-587}"
              printf 'SMTP_USER=%s\n'                "${SECRET_SMTP_USER}"
              printf 'SMTP_PASSWORD=%s\n'            "${SECRET_SMTP_PASSWORD}"
              printf 'SMTP_FROM=%s\n'                "${SECRET_SMTP_FROM}"
              printf 'DIGEST_RECIPIENT=%s\n'         "reesepludwick@gmail.com"
              printf 'JWT_EXPIRY_MINUTES=%s\n'       "60"
              printf 'LLM_TIMEOUT_SECONDS=%s\n'      "120"
              printf 'ENV=%s\n'                      "production"
              printf 'LANGGRAPH_CHECKPOINT_BACKEND=%s\n' "redis"
              printf 'ALERT_DRIFT_PCT_THRESHOLD=%s\n'    "25"
              printf 'ALERT_INCOME_DROP_PCT_THRESHOLD=%s\n' "30"
              printf 'POSTGRES_USER=%s\n'            "cfo"
              printf 'POSTGRES_PASSWORD=%s\n'        "cfo"
              printf 'POSTGRES_DB=%s\n'              "personal_cfo"
            } > .env
            echo "  .env written ($(wc -l < .env) lines)"

            echo ""
            echo "=== [3/6] Pulling image from GHCR ==="
            echo "${SECRET_GH_PAT}" | $DOCKER login ghcr.io -u reese8272 --password-stdin
            $DOCKER compose pull app
            echo "  Image pulled: ghcr.io/reese8272/cfo-agent:${DEPLOY_SHA}"

            echo ""
            echo "=== [4/6] Starting containers ==="
            $DOCKER compose up -d --no-build --remove-orphans
            $DOCKER compose ps

            echo ""
            echo "=== [5/6] Waiting for app to be ready (max 90s) ==="
            READY=0
            for i in $(seq 1 18); do
              HTTP_CODE=$($DOCKER compose exec -T app \
                curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/health \
                2>/dev/null || echo "000")
              echo "  attempt $i/18: HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ]; then
                READY=1
                echo "  App is responding ✓"
                break
              fi
              sleep 5
            done
            if [ "$READY" -eq 0 ]; then
              echo "App did not respond within 90s — dumping logs:"
              $DOCKER compose logs --tail 80 app
              exit 1
            fi

            echo ""
            echo "=== [6/6] Alembic migrations ==="
            CURRENT=$($DOCKER compose exec -T app alembic current 2>&1 || echo "error")
            echo "  alembic current: $CURRENT"
            if echo "$CURRENT" | grep -q "(head)"; then
              echo "  Already at head — skipping."
            else
              echo "  Running: alembic upgrade head"
              $DOCKER compose exec -T app alembic upgrade head
              echo "  Migrations complete."
            fi

            echo ""
            echo "=== Deploy complete ==="
            $DOCKER compose ps
