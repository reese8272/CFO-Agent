name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: []  # add 'test' from ci.yml once you merge CI into a reusable workflow

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY_ORIGINAL }}
          script: |
            set -e
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              git clone https://github.com/reese8272/CFO-Agent.git ${{ secrets.DEPLOY_PATH }}
            fi
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T app alembic upgrade head
            docker compose ps
