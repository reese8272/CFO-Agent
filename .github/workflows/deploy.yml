name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: Validate all required secrets before doing any real work ─────────
  validate-secrets:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate deployment secrets
        env:
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          # JWT_SECRET_KEY is auto-generated on the server each deploy — not a GitHub secret
          JWT_SECRET_KEY:          "auto-generated-per-deploy"
          VAULT_ENCRYPTION_KEY:    ${{ secrets.VAULT_ENCRYPTION_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SSH_PRIVATE_KEY:         ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST:             ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER:             ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH:             ${{ secrets.DEPLOY_PATH }}
          GH_PAT:                  ${{ secrets.GH_PAT }}
          SMTP_HOST:               ${{ secrets.SMTP_HOST }}
          SMTP_USER:               ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:           ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:               ${{ secrets.SMTP_FROM }}
          DATABASE_URL:            "placeholder"
          REDIS_URL:               "placeholder"
          DIGEST_RECIPIENT:        "placeholder"
        run: python scripts/audit_secrets.py

  # ── Job 2: Build and push Docker image to GHCR ────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [validate-secrets]
    permissions:
      contents: read
      packages: write

    outputs:
      image: ghcr.io/reese8272/cfo-agent:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/reese8272/cfo-agent:latest
            ghcr.io/reese8272/cfo-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to server via SSH ───────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: [build]

    steps:
      - name: Sanitize deploy host
        id: host
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          echo "value=$(printf '%s' "$HOST" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.host.outputs.value }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          debug: true
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            # Use sudo if the current session isn't in the docker group yet
            DOCKER="docker"
            if ! groups | grep -q docker; then
              DOCKER="sudo docker"
            fi

            GH_TOKEN="${{ secrets.GH_PAT }}"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/reese8272/CFO-Agent.git"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"

            echo "=== [1/6] Syncing repo ==="
            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              echo "  Fresh clone to ${DEPLOY_PATH}"
              git clone "${REPO_URL}" "${DEPLOY_PATH}"
            fi
            cd "${DEPLOY_PATH}"
            git remote set-url origin "${REPO_URL}"
            git fetch origin main
            git reset --hard origin/main
            echo "  Repo at: $(git log -1 --oneline)"

            echo ""
            echo "=== [2/6] Writing .env ==="

            # VAULT_ENCRYPTION_KEY: must come from GitHub secret — never auto-generate.
            # Changing it makes all encrypted vault data permanently unreadable.
            VAULT_KEY="${{ secrets.VAULT_ENCRYPTION_KEY }}"
            if [ -z "$VAULT_KEY" ]; then
              echo "✗ VAULT_ENCRYPTION_KEY secret is not set — aborting."
              echo "  Generate once with:"
              echo "    python3 -c \"import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())\""
              echo "  Then save to GitHub Secrets. Never rotate without a migration runbook."
              exit 1
            fi

            # JWT_SECRET_KEY: auto-generated on the server each deploy.
            # Rotating it on deploy invalidates active sessions (logs user out) — acceptable
            # for a single-user app and better security practice than a static value.
            JWT_KEY=$(openssl rand -hex 32)
            echo "  JWT_SECRET_KEY: generated fresh for this deploy ✓"

            cat > .env <<ENVEOF
ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
DATABASE_URL=postgresql+psycopg://cfo:cfo@postgres:5432/personal_cfo
REDIS_URL=redis://redis:6379/0
JWT_SECRET_KEY=${JWT_KEY}
VAULT_ENCRYPTION_KEY=${VAULT_KEY}
CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
SMTP_HOST=${{ secrets.SMTP_HOST }}
SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
SMTP_USER=${{ secrets.SMTP_USER }}
SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
SMTP_FROM=${{ secrets.SMTP_FROM }}
DIGEST_RECIPIENT=reesepludwick@gmail.com
JWT_EXPIRY_MINUTES=60
LLM_TIMEOUT_SECONDS=120
ENV=production
LANGGRAPH_CHECKPOINT_BACKEND=redis
ALERT_DRIFT_PCT_THRESHOLD=25
ALERT_INCOME_DROP_PCT_THRESHOLD=30
POSTGRES_USER=cfo
POSTGRES_PASSWORD=cfo
POSTGRES_DB=personal_cfo
ENVEOF
            echo "  .env written ($(wc -l < .env) lines)"

            echo ""
            echo "=== [3/6] Pulling image from GHCR ==="
            echo "${GH_TOKEN}" | $DOCKER login ghcr.io -u reese8272 --password-stdin
            $DOCKER compose pull app
            echo "  Image pulled: ghcr.io/reese8272/cfo-agent:${{ github.sha }}"

            echo ""
            echo "=== [4/6] Starting containers ==="
            $DOCKER compose up -d --no-build --remove-orphans
            $DOCKER compose ps

            echo ""
            echo "=== [5/6] Waiting for app to be ready (max 90s) ==="
            READY=0
            for i in $(seq 1 18); do
              # Try a real HTTP check — healthier than relying on Docker health state
              # which requires a HEALTHCHECK in the image.
              HTTP_CODE=$($DOCKER compose exec -T app \
                curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/health \
                2>/dev/null || echo "000")
              echo "  attempt $i/18: HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ]; then
                READY=1
                echo "  App is responding ✓"
                break
              fi
              sleep 5
            done
            if [ "$READY" -eq 0 ]; then
              echo "✗ App did not respond within 90s — dumping logs:"
              $DOCKER compose logs --tail 80 app
              exit 1
            fi

            echo ""
            echo "=== [6/6] Alembic migrations ==="
            # Check whether migrations need running rather than guessing from git diff.
            CURRENT=$($DOCKER compose exec -T app alembic current 2>&1 || echo "error")
            echo "  alembic current: $CURRENT"
            if echo "$CURRENT" | grep -q "(head)"; then
              echo "  Already at head — skipping."
            else
              echo "  Running: alembic upgrade head"
              $DOCKER compose exec -T app alembic upgrade head
              echo "  Migrations complete."
            fi

            echo ""
            echo "=== Deploy complete ==="
            $DOCKER compose ps
