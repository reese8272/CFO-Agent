name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ghcr.io/reese8272/cfo-agent:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/reese8272/cfo-agent:latest
            ghcr.io/reese8272/cfo-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: [build]

    steps:
      - name: Sanitize deploy host
        id: host
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          echo "value=$(printf '%s' "$HOST" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.host.outputs.value }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          debug: true
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            # Use sudo if the current session isn't in the docker group yet
            DOCKER="docker"
            if ! groups | grep -q docker; then
              DOCKER="sudo docker"
            fi

            GH_TOKEN="${{ secrets.GH_PAT }}"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/reese8272/CFO-Agent.git"

            # Bootstrap repo on first deploy
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              git clone "${REPO_URL}" ${{ secrets.DEPLOY_PATH }}
            fi

            cd ${{ secrets.DEPLOY_PATH }}
            git remote set-url origin "${REPO_URL}"
            git pull origin main

            # Write .env from secrets (safe to re-run — overwrites each deploy)
            cat > .env <<'ENVEOF'
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            DATABASE_URL=postgresql+psycopg://cfo:cfo@postgres:5432/personal_cfo
            REDIS_URL=redis://redis:6379/0
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            VAULT_ENCRYPTION_KEY=${{ secrets.VAULT_ENCRYPTION_KEY }}
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            SMTP_HOST=
            SMTP_PORT=587
            SMTP_USER=
            SMTP_PASSWORD=
            SMTP_FROM=
            DIGEST_RECIPIENT=reesepludwick@gmail.com
            JWT_EXPIRY_MINUTES=60
            LLM_TIMEOUT_SECONDS=120
            ENV=production
            LANGGRAPH_CHECKPOINT_BACKEND=redis
            ALERT_DRIFT_PCT_THRESHOLD=25
            ALERT_INCOME_DROP_PCT_THRESHOLD=30
            POSTGRES_USER=cfo
            POSTGRES_PASSWORD=cfo
            POSTGRES_DB=personal_cfo
            ENVEOF

            # Pull the pre-built image from GHCR (no docker build on server)
            echo "${GH_TOKEN}" | $DOCKER login ghcr.io -u reese8272 --password-stdin
            $DOCKER compose pull app

            $DOCKER compose up -d --no-build --remove-orphans

            # Wait for app to be healthy (max 90s)
            for i in $(seq 1 18); do
              STATUS=$($DOCKER inspect --format='{{.State.Health.Status}}' \
                $($DOCKER compose ps -q app) 2>/dev/null || echo "missing")
              echo "  attempt $i: health=$STATUS"
              if [ "$STATUS" = "healthy" ]; then break; fi
              if [ "$i" = "18" ]; then
                echo "App did not become healthy in 90s"
                $DOCKER compose logs --tail 50 app
                exit 1
              fi
              sleep 5
            done

            # Run migrations only when migration files changed
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^migrations/'; then
              echo "Running Alembic migrations..."
              $DOCKER compose exec -T app alembic upgrade head
            fi

            $DOCKER compose ps
