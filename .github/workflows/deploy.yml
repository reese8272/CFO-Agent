name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: Validate all required secrets exist before doing any real work ───
  validate-secrets:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Check required deployment secrets
        env:
          _ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          _JWT: ${{ secrets.JWT_SECRET_KEY }}
          _FERNET: ${{ secrets.VAULT_ENCRYPTION_KEY }}
          _CF: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          _HOST: ${{ secrets.DEPLOY_HOST }}
          _USER: ${{ secrets.DEPLOY_USER }}
          _KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          _PAT: ${{ secrets.GH_PAT }}
          _PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "=== Pre-Deploy Secret Audit ==="
          echo ""
          FAIL=0

          check_required() {
            local name="$1"
            local val="$2"
            local min_len="${3:-1}"
            local len="${#val}"
            if [ "$len" -eq 0 ]; then
              echo "✗ $name : NOT SET — deploy will fail"
              FAIL=1
            elif [ "$len" -lt "$min_len" ]; then
              echo "✗ $name : SET but too short (${len} chars, need ≥${min_len}) — deploy will fail"
              FAIL=1
            else
              echo "✓ $name : OK (${len} chars)"
            fi
          }

          check_format() {
            local name="$1"
            local val="$2"
            local expected_prefix="$3"
            local len="${#val}"
            if [ "$len" -eq 0 ]; then
              echo "✗ $name : NOT SET"
              FAIL=1
              return
            fi
            actual_prefix=$(printf '%s' "$val" | cut -c1-${#expected_prefix})
            if [ "$actual_prefix" = "$expected_prefix" ]; then
              echo "✓ $name : OK (${len} chars, prefix=${expected_prefix}✓)"
            else
              echo "⚠ $name : SET (${len} chars) but unexpected prefix — expected '${expected_prefix}'"
            fi
          }

          check_fernet() {
            local name="$1"
            local val="$2"
            local len="${#val}"
            if [ "$len" -eq 0 ]; then
              echo "✗ $name : NOT SET — all vault data will be unreadable"
              FAIL=1
              return
            fi
            # Fernet keys are 44 chars of url-safe base64
            if [ "$len" -eq 44 ]; then
              echo "✓ $name : OK (${len} chars, correct Fernet length)"
            else
              echo "⚠ $name : SET (${len} chars) — Fernet keys should be exactly 44 chars. Re-generate if wrong."
            fi
          }

          check_format    "ANTHROPIC_API_KEY    " "$_ANTHROPIC" "sk-ant-"
          check_required  "JWT_SECRET_KEY       " "$_JWT"       32
          check_fernet    "VAULT_ENCRYPTION_KEY " "$_FERNET"
          check_required  "CLOUDFLARE_TUNNEL_TOK" "$_CF"
          check_required  "DEPLOY_HOST          " "$_HOST"
          check_required  "DEPLOY_USER          " "$_USER"
          check_required  "SSH_PRIVATE_KEY      " "$_KEY"       200
          check_required  "GH_PAT               " "$_PAT"
          check_required  "DEPLOY_PATH          " "$_PATH"

          echo ""
          if [ "$FAIL" -eq 1 ]; then
            echo "✗ One or more required secrets are missing or malformed."
            echo "  Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "  See docs/ENV_CHECKLIST.md for generation instructions."
            exit 1
          else
            echo "✓ All required secrets present. Proceeding with build + deploy."
          fi

  # ── Job 2: Build and push Docker image to GHCR ────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [validate-secrets]
    permissions:
      contents: read
      packages: write

    outputs:
      image: ghcr.io/reese8272/cfo-agent:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/reese8272/cfo-agent:latest
            ghcr.io/reese8272/cfo-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to server via SSH ───────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: [build]

    steps:
      - name: Sanitize deploy host
        id: host
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          echo "value=$(printf '%s' "$HOST" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.host.outputs.value }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          debug: true
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            # Use sudo if the current session isn't in the docker group yet
            DOCKER="docker"
            if ! groups | grep -q docker; then
              DOCKER="sudo docker"
            fi

            GH_TOKEN="${{ secrets.GH_PAT }}"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/reese8272/CFO-Agent.git"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"

            echo "=== [1/6] Syncing repo ==="
            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              echo "  Fresh clone to ${DEPLOY_PATH}"
              git clone "${REPO_URL}" "${DEPLOY_PATH}"
            fi
            cd "${DEPLOY_PATH}"
            git remote set-url origin "${REPO_URL}"
            git fetch origin main
            git reset --hard origin/main
            echo "  Repo at: $(git log -1 --oneline)"

            echo ""
            echo "=== [2/6] Writing .env ==="
            # Write each line explicitly — no indentation issues, SMTP optional.
            cat > .env <<ENVEOF
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            DATABASE_URL=postgresql+psycopg://cfo:cfo@postgres:5432/personal_cfo
            REDIS_URL=redis://redis:6379/0
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            VAULT_ENCRYPTION_KEY=${{ secrets.VAULT_ENCRYPTION_KEY }}
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            DIGEST_RECIPIENT=reesepludwick@gmail.com
            JWT_EXPIRY_MINUTES=60
            LLM_TIMEOUT_SECONDS=120
            ENV=production
            LANGGRAPH_CHECKPOINT_BACKEND=redis
            ALERT_DRIFT_PCT_THRESHOLD=25
            ALERT_INCOME_DROP_PCT_THRESHOLD=30
            POSTGRES_USER=cfo
            POSTGRES_PASSWORD=cfo
            POSTGRES_DB=personal_cfo
            ENVEOF
            # Strip leading whitespace python-dotenv might otherwise see
            sed -i 's/^[[:space:]]*//' .env
            echo "  .env written ($(wc -l < .env) lines)"

            echo ""
            echo "=== [3/6] Pulling image from GHCR ==="
            echo "${GH_TOKEN}" | $DOCKER login ghcr.io -u reese8272 --password-stdin
            $DOCKER compose pull app
            echo "  Image pulled: ghcr.io/reese8272/cfo-agent:${{ github.sha }}"

            echo ""
            echo "=== [4/6] Starting containers ==="
            $DOCKER compose up -d --no-build --remove-orphans
            $DOCKER compose ps

            echo ""
            echo "=== [5/6] Waiting for app to be ready (max 90s) ==="
            READY=0
            for i in $(seq 1 18); do
              # Try a real HTTP check — healthier than relying on Docker health state
              # which requires a HEALTHCHECK in the image.
              HTTP_CODE=$($DOCKER compose exec -T app \
                curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/health \
                2>/dev/null || echo "000")
              echo "  attempt $i/18: HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ]; then
                READY=1
                echo "  App is responding ✓"
                break
              fi
              sleep 5
            done
            if [ "$READY" -eq 0 ]; then
              echo "✗ App did not respond within 90s — dumping logs:"
              $DOCKER compose logs --tail 80 app
              exit 1
            fi

            echo ""
            echo "=== [6/6] Alembic migrations ==="
            # Check whether migrations need running rather than guessing from git diff.
            CURRENT=$($DOCKER compose exec -T app alembic current 2>&1 || echo "error")
            echo "  alembic current: $CURRENT"
            if echo "$CURRENT" | grep -q "(head)"; then
              echo "  Already at head — skipping."
            else
              echo "  Running: alembic upgrade head"
              $DOCKER compose exec -T app alembic upgrade head
              echo "  Migrations complete."
            fi

            echo ""
            echo "=== Deploy complete ==="
            $DOCKER compose ps
