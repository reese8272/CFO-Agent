name: Setup Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  setup-tunnel:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Add CLOUDFLARE_TUNNEL_TOKEN to server .env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY_ORIGINAL }}
          script: |
            set -e
            ENV_FILE=${{ secrets.DEPLOY_PATH }}/.env

            # Remove any existing entry and append the current token
            sed -i '/^CLOUDFLARE_TUNNEL_TOKEN=/d' "$ENV_FILE"
            echo "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" >> "$ENV_FILE"

            echo "Token written. Run the deploy workflow to restart the stack."
