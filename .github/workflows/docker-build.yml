name: Docker Build (validate)

# Validates that the image builds correctly on PRs and feature branches.
# Pushing to GHCR is handled by deploy.yml on merge to main.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: personal-cfo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
